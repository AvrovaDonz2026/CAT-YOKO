[project]
name = "cat-yoko"
version = "0.1.0"
description = "CAT-YOKO-12B: YOCO causal encoder-decoder MoE upcycled from MiniCPM5-2B"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
megatron = ["megatron-core>=0.12"]
deepspeed = ["deepspeed>=0.14"]
data = ["datasets>=2.18", "transformers>=4.40"]

[project.scripts]
cat-yoko-train = "cat_yoko.train:main"
cat-yoko-b0 = "cat_yoko.phase_train:main_b0"
cat-yoko-b1 = "cat_yoko.phase_train:main_b1"
cat-yoko-b2 = "cat_yoko.phase_train:main_b2"
cat-yoko-c = "cat_yoko.phase_train:main_c"
cat-yoko-d = "cat_yoko.phase_train:main_d"
cat-yoko-e = "cat_yoko.phase_train:main_e"
cat-yoko-f = "cat_yoko.phase_train:main_f"
cat-yoko-g = "cat_yoko.phase_train:main_g"
cat-yoko-prepare = "cat_yoko.prepare:main"
cat-yoko-gpu-smoke = "cat_yoko.gpu_smoke:main"
cat-yoko-hw-recipe = "cat_yoko.hw_recipe:main"
cat-yoko-plan-verify = "cat_yoko.plan_verify:main"

[project.urls]
Megatron-LM = "https://github.com/NVIDIA/Megatron-LM"
DeepSpeed = "https://github.com/microsoft/DeepSpeed"

[tool.setuptools.packages.find]
include = ["cat_yoko*"]

[tool.setuptools.package-data]
cat_yoko = ["py.typed"]
